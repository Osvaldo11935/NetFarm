AWSTemplateFormatVersion: '2010-09-09'

Description: NetFarm ECS Fargate Infrastructure

Parameters:

  ProjectName:
    Type: String
    Default: netfarm

  NetworkStackName:
    Type: String
    Default: netfarm-network

  ECRRepository:
    Type: String

  ImageTag:
    Type: String
    Default: latest

  ContainerPort:
    Type: Number
    Default: 8000

  ContainerCpu:
    Type: String
    Default: '256'

  ContainerMemory:
    Type: String
    Default: '512'

  DesiredCount:
    Type: Number
    Default: 2


Resources:

  # ==========================================================
  # CLOUDWATCH LOG GROUP
  # ==========================================================

  LogGroup:
    Type: AWS::Logs::LogGroup

    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}'
      RetentionInDays: 30


  # ==========================================================
  # ECS CLUSTER
  # ==========================================================

  ECSCluster:
    Type: AWS::ECS::Cluster

    Properties:
      ClusterName: !Sub '${ProjectName}-cluster'


  # ==========================================================
  # ECS TASK EXECUTION ROLE
  # ==========================================================

  ECSExecutionRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub '${ProjectName}-ecs-execution-role'

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - ecs-tasks.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy


  # ==========================================================
  # SECRETS MANAGER POLICY
  # ==========================================================

  ECSExecutionSecretsPolicy:
    Type: AWS::IAM::Policy

    Properties:

      PolicyName: !Sub '${ProjectName}-ecs-secrets-policy'

      Roles:
        - !Ref ECSExecutionRole

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Action:

              - secretsmanager:GetSecretValue

            Resource:

              # POSTGRES
              - Fn::ImportValue:
                  !Sub '${ProjectName}-PostgresUserSecretArn'

              - Fn::ImportValue:
                  !Sub '${ProjectName}-PostgresPortSecretArn'

              - Fn::ImportValue:
                  !Sub '${ProjectName}-PostgresHostSecretArn'

              - Fn::ImportValue:
                  !Sub '${ProjectName}-PostgresPasswordSecretArn'

              - Fn::ImportValue:
                  !Sub '${ProjectName}-PostgresDatabaseSecretArn'

              - Fn::ImportValue:
                  !Sub '${ProjectName}-PostgresConnectionStringSecretArn'

              # GOOGLE STORAGE
              - Fn::ImportValue:
                  !Sub '${ProjectName}-BucketNameSecretArn'

              - Fn::ImportValue:
                  !Sub '${ProjectName}-FileConfigGoogleStorageSecretArn'

              - Fn::ImportValue:
                  !Sub '${ProjectName}-BaseUrlGoogleStorageSecretArn'

              # APPLICATION
              - Fn::ImportValue:
                  !Sub '${ProjectName}-PortSecretArn'


  # ==========================================================
  # ECS TASK ROLE
  # ==========================================================

  ECSTaskRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub '${ProjectName}-ecs-task-role'

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - ecs-tasks.amazonaws.com

            Action:
              - sts:AssumeRole


  # ==========================================================
  # ECS TASK DEFINITION
  # ==========================================================

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition

    DependsOn:
      - ECSExecutionSecretsPolicy

    Properties:

      Family: !Sub '${ProjectName}-task'

      NetworkMode: awsvpc

      RequiresCompatibilities:

        - FARGATE

      Cpu: !Ref ContainerCpu

      Memory: !Ref ContainerMemory

      ExecutionRoleArn:
        Fn::GetAtt:
          - ECSExecutionRole
          - Arn

      TaskRoleArn:
        Fn::GetAtt:
          - ECSTaskRole
          - Arn


      # ========================================================
      # CONTAINER
      # ========================================================

      ContainerDefinitions:

        - Name: !Ref ProjectName

          Image: !Sub '${ECRRepository}:${ImageTag}'

          Essential: true

          Cpu: !Ref ContainerCpu

          Memory: !Ref ContainerMemory


          # ==================================================
          # PORT
          # ==================================================

          PortMappings:

            - ContainerPort: !Ref ContainerPort

              HostPort: !Ref ContainerPort

              Protocol: tcp


          # ==================================================
          # SECRETS
          # ==================================================

          Secrets:

            # ------------------------------------------------
            # POSTGRES
            # ------------------------------------------------

            - Name: POSTGRES_USER

              ValueFrom:
                Fn::ImportValue:
                  !Sub '${ProjectName}-PostgresUserSecretArn'


            - Name: POSTGRES_PORT

              ValueFrom:
                Fn::ImportValue:
                  !Sub '${ProjectName}-PostgresPortSecretArn'


            - Name: POSTGRES_HOST

              ValueFrom:
                Fn::ImportValue:
                  !Sub '${ProjectName}-PostgresHostSecretArn'


            - Name: POSTGRES_PASSWORD

              ValueFrom:
                Fn::ImportValue:
                  !Sub '${ProjectName}-PostgresPasswordSecretArn'


            - Name: POSTGRES_DATABASE

              ValueFrom:
                Fn::ImportValue:
                  !Sub '${ProjectName}-PostgresDatabaseSecretArn'


            - Name: POSTGRES_CONNECTION_STRING

              ValueFrom:
                Fn::ImportValue:
                  !Sub '${ProjectName}-PostgresConnectionStringSecretArn'


            # ------------------------------------------------
            # GOOGLE STORAGE
            # ------------------------------------------------

            - Name: BUCKET_NAME

              ValueFrom:
                Fn::ImportValue:
                  !Sub '${ProjectName}-BucketNameSecretArn'


            - Name: FILE_CONFIG_GOOGLE_STORAGE

              ValueFrom:
                Fn::ImportValue:
                  !Sub '${ProjectName}-FileConfigGoogleStorageSecretArn'


            - Name: BASE_URL_GOOGLE_STORAGE

              ValueFrom:
                Fn::ImportValue:
                  !Sub '${ProjectName}-BaseUrlGoogleStorageSecretArn'


            # ------------------------------------------------
            # APPLICATION
            # ------------------------------------------------

            - Name: PORT

              ValueFrom:
                Fn::ImportValue:
                  !Sub '${ProjectName}-PortSecretArn'


          # ==================================================
          # CLOUDWATCH LOGS
          # ==================================================

          LogConfiguration:

            LogDriver: awslogs

            Options:

              awslogs-group: !Ref LogGroup

              awslogs-region: !Ref AWS::Region

              awslogs-stream-prefix: ecs


      # ======================================================
      # TAGS
      # ======================================================

      Tags:

        - Key: Project

          Value: !Ref ProjectName


  # ==========================================================
  # ECS SERVICE
  # ==========================================================

  ECSService:
    Type: AWS::ECS::Service

    DependsOn:
      - TaskDefinition

    Properties:

      ServiceName: !Sub '${ProjectName}-service'

      Cluster: !Ref ECSCluster

      LaunchType: FARGATE

      DesiredCount: !Ref DesiredCount

      TaskDefinition: !Ref TaskDefinition


      # ========================================================
      # DEPLOYMENT
      # ========================================================

      DeploymentConfiguration:

        MaximumPercent: 200

        MinimumHealthyPercent: 50


      # ========================================================
      # LOAD BALANCER
      # ========================================================

      LoadBalancers:

        - ContainerName: !Ref ProjectName

          ContainerPort: !Ref ContainerPort

          TargetGroupArn:

            Fn::ImportValue:
              !Sub '${NetworkStackName}-TargetGroupArn'


      # ========================================================
      # NETWORK
      # ========================================================

      NetworkConfiguration:

        AwsvpcConfiguration:

          AssignPublicIp: ENABLED

          SecurityGroups:

            - Fn::ImportValue:
                !Sub '${NetworkStackName}-SecurityGroup'

          Subnets:

            - Fn::ImportValue:
                !Sub '${NetworkStackName}-PublicSubnet1'

            - Fn::ImportValue:
                !Sub '${NetworkStackName}-PublicSubnet2'


      # ========================================================
      # HEALTH CHECK GRACE PERIOD
      # ========================================================

      HealthCheckGracePeriodSeconds: 60


      # ========================================================
      # DEPLOYMENT CONTROLLER
      # ========================================================

      DeploymentController:

        Type: ECS


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:


  # ==========================================================
  # CLUSTER
  # ==========================================================

  ClusterName:

    Description: ECS Cluster Name

    Value: !Ref ECSCluster


  # ==========================================================
  # SERVICE
  # ==========================================================

  ServiceName:

    Description: ECS Service Name

    Value: !Ref ECSService


  # ==========================================================
  # TASK DEFINITION
  # ==========================================================

  TaskDefinition:

    Description: ECS Task Definition

    Value: !Ref TaskDefinition


  # ==========================================================
  # EXECUTION ROLE
  # ==========================================================

  ExecutionRole:

    Description: ECS Task Execution Role

    Value:
      Fn::GetAtt:
        - ECSExecutionRole
        - Arn


  # ==========================================================
  # TASK ROLE
  # ==========================================================

  TaskRole:

    Description: ECS Task Role

    Value:
      Fn::GetAtt:
        - ECSTaskRole
        - Arn
