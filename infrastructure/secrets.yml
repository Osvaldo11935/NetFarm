AWSTemplateFormatVersion: '2010-09-09'

Description: NetFarm Secrets Manager Infrastructure

Parameters:

  ProjectName:
    Type: String
    Default: netfarm


Resources:

  # ==========================================================
  # POSTGRES USER
  # ==========================================================

  PostgresUserSecret:
    Type: AWS::SecretsManager::Secret

    Properties:
      Name: !Sub '${ProjectName}/POSTGRES_USER'
      Description: PostgreSQL username
      SecretString: '{}'


  # ==========================================================
  # POSTGRES PORT
  # ==========================================================

  PostgresPortSecret:
    Type: AWS::SecretsManager::Secret

    Properties:
      Name: !Sub '${ProjectName}/POSTGRES_PORT'
      Description: PostgreSQL port
      SecretString: '{}'


  # ==========================================================
  # POSTGRES HOST
  # ==========================================================

  PostgresHostSecret:
    Type: AWS::SecretsManager::Secret

    Properties:
      Name: !Sub '${ProjectName}/POSTGRES_HOST'
      Description: PostgreSQL host
      SecretString: '{}'


  # ==========================================================
  # POSTGRES PASSWORD
  # ==========================================================

  PostgresPasswordSecret:
    Type: AWS::SecretsManager::Secret

    Properties:
      Name: !Sub '${ProjectName}/POSTGRES_PASSWORD'
      Description: PostgreSQL password
      SecretString: '{}'


  # ==========================================================
  # POSTGRES DATABASE
  # ==========================================================

  PostgresDatabaseSecret:
    Type: AWS::SecretsManager::Secret

    Properties:
      Name: !Sub '${ProjectName}/POSTGRES_DATABASE'
      Description: PostgreSQL database name
      SecretString: '{}'


  # ==========================================================
  # POSTGRES CONNECTION STRING
  # ==========================================================

  PostgresConnectionStringSecret:
    Type: AWS::SecretsManager::Secret

    Properties:
      Name: !Sub '${ProjectName}/POSTGRES_CONNECTION_STRING'
      Description: PostgreSQL connection string
      SecretString: '{}'


  # ==========================================================
  # GOOGLE STORAGE BUCKET
  # ==========================================================

  BucketNameSecret:
    Type: AWS::SecretsManager::Secret

    Properties:
      Name: !Sub '${ProjectName}/BUCKET_NAME'
      Description: Google Cloud Storage bucket name
      SecretString: '{}'


  # ==========================================================
  # GOOGLE STORAGE CONFIG
  # ==========================================================

  FileConfigGoogleStorageSecret:
    Type: AWS::SecretsManager::Secret

    Properties:
      Name: !Sub '${ProjectName}/FILE_CONFIG_GOOGLE_STORAGE'
      Description: Google Cloud Storage configuration file
      SecretString: '{}'


  # ==========================================================
  # GOOGLE STORAGE BASE URL
  # ==========================================================

  BaseUrlGoogleStorageSecret:
    Type: AWS::SecretsManager::Secret

    Properties:
      Name: !Sub '${ProjectName}/BASE_URL_GOOGLE_STORAGE'
      Description: Google Cloud Storage base URL
      SecretString: '{}'


  # ==========================================================
  # APPLICATION PORT
  # ==========================================================

  PortSecret:
    Type: AWS::SecretsManager::Secret

    Properties:
      Name: !Sub '${ProjectName}/PORT'
      Description: Application port
      SecretString: '{}'


Outputs:

  # ==========================================================
  # POSTGRES USER
  # ==========================================================

  PostgresUserSecretArn:
    Value: !Ref PostgresUserSecret

    Export:
      Name: !Sub '${ProjectName}-PostgresUserSecretArn'


  # ==========================================================
  # POSTGRES PORT
  # ==========================================================

  PostgresPortSecretArn:
    Value: !Ref PostgresPortSecret

    Export:
      Name: !Sub '${ProjectName}-PostgresPortSecretArn'


  # ==========================================================
  # POSTGRES HOST
  # ==========================================================

  PostgresHostSecretArn:
    Value: !Ref PostgresHostSecret

    Export:
      Name: !Sub '${ProjectName}-PostgresHostSecretArn'


  # ==========================================================
  # POSTGRES PASSWORD
  # ==========================================================

  PostgresPasswordSecretArn:
    Value: !Ref PostgresPasswordSecret

    Export:
      Name: !Sub '${ProjectName}-PostgresPasswordSecretArn'


  # ==========================================================
  # POSTGRES DATABASE
  # ==========================================================

  PostgresDatabaseSecretArn:
    Value: !Ref PostgresDatabaseSecret

    Export:
      Name: !Sub '${ProjectName}-PostgresDatabaseSecretArn'


  # ==========================================================
  # POSTGRES CONNECTION STRING
  # ==========================================================

  PostgresConnectionStringSecretArn:
    Value: !Ref PostgresConnectionStringSecret

    Export:
      Name: !Sub '${ProjectName}-PostgresConnectionStringSecretArn'


  # ==========================================================
  # BUCKET NAME
  # ==========================================================

  BucketNameSecretArn:
    Value: !Ref BucketNameSecret

    Export:
      Name: !Sub '${ProjectName}-BucketNameSecretArn'


  # ==========================================================
  # FILE CONFIG GOOGLE STORAGE
  # ==========================================================

  FileConfigGoogleStorageSecretArn:
    Value: !Ref FileConfigGoogleStorageSecret

    Export:
      Name: !Sub '${ProjectName}-FileConfigGoogleStorageSecretArn'


  # ==========================================================
  # BASE URL GOOGLE STORAGE
  # ==========================================================

  BaseUrlGoogleStorageSecretArn:
    Value: !Ref BaseUrlGoogleStorageSecret

    Export:
      Name: !Sub '${ProjectName}-BaseUrlGoogleStorageSecretArn'


  # ==========================================================
  # PORT
  # ==========================================================

  PortSecretArn:
    Value: !Ref PortSecret

    Export:
      Name: !Sub '${ProjectName}-PortSecretArn'
